<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seva Sthiti · prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens sampled from Figma section 766:3043 (quality os changes). */
:root{
  --page:#F1EDF7; --sheet:#FAF9FC; --surface:#FFFFFF; --header:#4A1535;
  --muted:#E8E4F0; --subtle:#F1EDF7;
  --ink:#161021; --ink-a:#170F21; --ink-2:#5C5570; --ink-3:#665E75; --ink-4:#8C8799; --hint:#A7A1B2;
  --nonaction:#898296; --ondark:#FAF9FC; --headerIcon:#E8E4F0; --tileInk:#403B4D;
  --pos:#008043; --pos-2:#008042; --posTrend:#21AB73; --neg:#D92130;
  --warnInk:#372902; --warnOrange:#FF8000; --brand:#D9008D;
  --heroWarn:#FFF7D9; --heroWarnIc:#FFE08A; --heroOk:#EDFCF4; --heroOkIc:#B8E6CE;
  --heroCrit:#FFEFF0; --heroCritIc:#FFC7CB;
  --pillCrit:#FFE5E7; --pillOk:#E8FAED;
  --barMetP:#AFCFB0; --barMissP:#FFD3D7; --barMetN:#D9EDD9; --barMissN:#FFE5E7; --barNone:#F1EDF7;
  --tileNeutral:#F1EDF7; --tilePos:#E8FAED; --tileNeg:#FFD3D7;
  --r:16px; --rs:12px; --rp:999px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;background:#2B2B33;color:var(--ink);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;gap:26px;flex-wrap:wrap}

/* Controls live outside the device, as requested. */
.panel{width:250px;color:#CFCAD8;font:400 12px/1.55 "Noto Sans",sans-serif;flex:0 0 auto}
.panel h1{font:700 16px/1.3 "Noto Sans";color:#fff;margin-bottom:14px}
.panel .grp{margin-bottom:18px}
.panel .lbl{font:600 10px/1 "Noto Sans";letter-spacing:.09em;text-transform:uppercase;color:#7E7890;margin-bottom:7px}
.seg{display:flex;flex-direction:column;gap:5px}
.seg button{width:100%;text-align:left;border:1px solid #3D3947;background:#33303C;color:#CFCAD8;
  border-radius:9px;padding:8px 11px;font:600 12px/1.3 "Noto Sans Devanagari";cursor:pointer;transition:.15s}
.seg button:hover{border-color:#565064}
.seg button.on{background:#fff;color:#161021;border-color:#fff}
.seg.row{flex-direction:row}
.seg.row button{text-align:center}
.panel .hint{font:400 11px/1.5 "Noto Sans";color:#7E7890;margin-top:8px}

/* 360×720 viewport at 1:1 with Figma — no scaling, so 16dp is 16px. */
.device{width:370px;height:730px;border-radius:26px;background:#000;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.5);flex:0 0 auto}
.screen{position:relative;width:360px;height:720px;border-radius:22px;overflow:hidden;background:var(--page)}
.canvas{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page)}

/* Phone-only debug switcher: hidden on desktop, where the side panel serves. */
.topbar .dbgBtn{display:none;width:24px;height:24px;color:var(--headerIcon);opacity:.65}
.dbgBtn.on{opacity:1;color:#fff}
.dbgPanel{background:#2B2333;border-radius:var(--r);padding:12px;
  display:flex;flex-direction:column;gap:12px}
.dbgGrp{display:flex;flex-direction:column;gap:6px}
.dbgLbl{font:600 10px/1 "Noto Sans";letter-spacing:.09em;text-transform:uppercase;color:#8C86A0}
.dbgSeg{display:flex;flex-wrap:wrap;gap:6px}
.dbgSeg button{font:400 12px/1.3 "Noto Sans Devanagari";color:#CFCAD8;background:#3A3145;
  border:0;border-radius:var(--rp);padding:7px 12px;cursor:pointer}
.dbgSeg button.on{background:#FAF9FC;color:#231C2E;font-weight:600}

/* Phone: drop the panel and the bezel so the screen fills the viewport and
   reads as the app itself, not a mockup of it. Only .scroll scrolls. */
@media (max-width:720px){
  body{display:block;padding:0;gap:0;min-height:0;background:var(--page);
    overflow:hidden;overscroll-behavior:none}
  .panel{display:none}
  .topbar .dbgBtn{display:inline-flex}
  .device{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;
    background:var(--page);box-shadow:none}
  .screen{width:100%;height:100%;border-radius:0}
  .scroll{-webkit-overflow-scrolling:touch}
}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:16px;background:var(--header)}
.topbar .ttl{flex:1;font:700 18px/26px "Noto Sans Devanagari";color:var(--ondark)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg{width:100%;height:100%;display:block}
.tap{cursor:pointer}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}
.body{display:flex;flex-direction:column;gap:24px;padding:16px}

.card{background:var(--sheet);border-radius:var(--r)}
.pad{padding:16px}
.divider{height:1px;background:var(--muted);border:0}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head .t{flex:1;font:600 15px/22px "Noto Sans Devanagari";letter-spacing:-.1px}
.sec-head .m{font:400 12px/16px "Noto Sans Devanagari";color:var(--ink-3)}
.sec-sub{font:400 12px/18px "Noto Sans Devanagari";color:var(--ink-3);margin-top:2px}

.hero{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero.warn{background:var(--heroWarn);box-shadow:inset 0 0 0 1px #E6C18D}
.hero.ok{background:var(--heroOk);box-shadow:inset 0 0 0 1px #9AD1B6}
.hero.crit{background:var(--heroCrit);box-shadow:inset 0 0 0 1px #F2A8AD}
.hero .cycle{font:600 12px/16px "Noto Sans Devanagari"}
.hero .head{display:flex;gap:12px;align-items:flex-start}
.hero .texts{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
/* Its own surface on the hero tint, so it reads as a tappable row without
   reintroducing a divider, and the value calms down against white. */
.hero .hmet{display:flex;align-items:center;gap:10px;cursor:pointer;margin-left:32px;
  padding:0 0 9px}
.hero .hmet + .hmet{margin-top:0;padding-top:9px;border-top:1px solid rgba(22,16,33,.09)}
.hero .hmet:active{opacity:.6}
.hero .hml{flex:1;min-width:0;font:500 14px/21px "Noto Sans Devanagari";color:var(--ink-a)}
.hero .hmrow{display:flex;align-items:baseline;gap:5px;flex:0 0 auto}
.hero .hmv{font:700 14px/21px "Noto Sans"}
.hero .hmv.pos{color:var(--pos)} .hero .hmv.neg{color:var(--neg)}
.hero .hmt{font:400 11px/16px "Noto Sans Devanagari";color:var(--ink-3);white-space:nowrap}
.hero .hmg{width:20px;height:20px;color:var(--nonaction);transform:rotate(-90deg);flex:0 0 auto}
.hero .h1{font:700 16px/24px "Noto Sans Devanagari"}
.hero .h2{font:400 14px/20px "Noto Sans Devanagari";color:var(--ink-2)}
.bubble{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 "Noto Sans";flex:0 0 auto}
.bubble.warn{background:var(--heroWarnIc);color:var(--warnInk)}
.bubble.crit{background:var(--heroCritIc);color:var(--neg)}
.bubble.ok{background:var(--heroOkIc);color:var(--pos)}
.bubble.mut{background:var(--muted);color:var(--nonaction)}
.bubble.mut .ic{width:12px;height:12px}
.bubble.ok .ic,.bubble.crit .ic{width:13px;height:13px}
.bubble.sm{width:18px;height:18px}
.bubble.sm.fail{background:#FFEFF0;box-shadow:inset 0 0 0 1px #FFB7BD;color:var(--neg)}
.bubble.sm.pass{background:var(--muted);box-shadow:inset 0 0 0 1px #C8C6CC;color:var(--nonaction)}
.bubble.sm .ic{width:12px;height:12px}
.qbtn{width:14px;height:14px;border-radius:50%;background:var(--muted);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
/* The glyph is injected as a bare <svg>, so it needs its own size rule. */
.qbtn svg{width:10px;height:10px;display:block}
.qbtn.q18{width:18px;height:18px}
.qbtn.lg{width:24px;height:24px} .qbtn.lg svg{width:12px;height:12px}
.qbtn:active{background:#D9D3E6}

.mrow{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:5px;cursor:pointer}
.mrow:active{background:#F1EDF7}
.rowset{display:flex;flex-direction:column;gap:6px}
.rowset .rule{height:1px;background:var(--muted);margin:0 8px}
.bonusset .rule{margin:0}
.mrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mrow .vwrap{display:flex;align-items:center;gap:6px}
.mrow .tgt2{font:400 12px/16px "Noto Sans Devanagari";color:var(--ink-3)}
.mrow .go{width:20px;height:20px;color:var(--nonaction);transform:rotate(-90deg);flex:0 0 auto}
.trend{width:20px;height:20px;flex:0 0 auto;margin-right:-2px}
.hero .cycle{display:none}
.hero .dates{font:600 12px/16px "Noto Sans Devanagari";color:var(--ink)}
.hero .titleRow{display:flex;align-items:baseline;gap:5px}
.hero .divider{background:#898296}
.mrow .l1{display:flex;align-items:center;gap:6px}
.mrow .lbl{font:400 14px/20px "Noto Sans Devanagari"}
.mrow .val{font:700 14px/20px "Noto Sans Devanagari";white-space:nowrap}
.mrow .itgt{font:400 14px/20px "Noto Sans Devanagari";color:var(--ink-3);white-space:nowrap}
.mrow .lbl{min-width:0}
.mrow .l2{display:flex;align-items:center;gap:6px}
.brow .l2{gap:8px}
.mrow .lnk{flex:1;font:600 12px/16px "Noto Sans Devanagari";color:var(--ink-2);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.mrow .tgt{font:400 12px/16px "Noto Sans Devanagari";color:var(--ink-3)}
.spacer{flex:1}
.pos{color:var(--pos)} .neg{color:var(--neg)} .ink{color:var(--ink)} .muted{color:var(--hint)}

.dom{background:var(--sheet);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:0}
.dom .dhead{display:flex;align-items:center;gap:8px;cursor:pointer}
.dom .dname{font:700 15px/22px "Noto Sans Devanagari";letter-spacing:-.1px}
.dom .dcount{font:600 14px/20px "Noto Sans Devanagari"}
.chev{width:24px;height:24px;color:var(--nonaction);transition:transform .22s ease}
.chev.up{transform:rotate(180deg)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.collapse.open{grid-template-rows:1fr}
.collapse > .inner{overflow:hidden;min-height:0}
.stack{display:flex;flex-direction:column;gap:12px}

.banner{border-radius:var(--rs);padding:12px;display:flex;align-items:center;gap:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px #D7D3E0}
.banner.crit{background:var(--pillCrit)}
.banner .bt{flex:1;font:600 14px/20px "Noto Sans Devanagari"}
.badge{border-radius:4px;padding:4px 8px;font:600 12px/16px "Noto Sans Devanagari"}
.badge.neutral{background:var(--subtle);color:var(--ink-3)}
.badge.pos{background:var(--pillOk);color:var(--pos)}
.badge.crit{background:var(--pillCrit);color:var(--neg)}
.badge.basic{background:#FFF2BF;color:var(--warnInk)}
.badge.neg{background:var(--pillCrit);color:var(--neg)}

.footcard{background:var(--sheet);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.footcard .circ{width:36px;height:36px;border-radius:50%;background:var(--muted);
  display:flex;align-items:center;justify-content:center;color:var(--nonaction);flex:0 0 auto}
.footcard .circ .ic{width:20px;height:20px}
.footcard .circ .ic svg{width:100%;height:100%}
.footcard .ft{flex:1;font:400 14px/20px "Noto Sans Devanagari"}
.prevBody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--heroWarn);border-radius:var(--rp);padding:4px 12px;align-self:flex-start}
.chip .cb{width:20px;height:20px;border-radius:50%;background:var(--heroWarnIc);color:var(--warnOrange);
  display:flex;align-items:center;justify-content:center;font:700 12px/1 "Noto Sans"}
.chip .ct{font:500 16px/24px "Noto Sans Devanagari"}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;align-items:center;gap:8px}
.vrow .bul{width:4px;height:4px;border-radius:50%;background:var(--hint);flex:0 0 auto;margin-right:2px}
.vrow .vl{flex:1;font:400 14px/20px "Noto Sans Devanagari"}
.vrow .vv{font:600 14px/20px "Noto Sans Devanagari"}
.subhead{font:600 14px/20px "Noto Sans Devanagari"}
.note{display:flex;gap:8px;font:400 14px/20px "Noto Sans Devanagari";color:var(--ink-3)}
.eduIntro{font:400 12px/18px "Noto Sans Devanagari";color:#494551}
.eduCard{background:var(--surface);border-radius:var(--rs);padding:12px}
.eduCard .et{font:700 13px/18px "Noto Sans Devanagari";color:#1D1A22}
.eduCard .es{font:400 11px/16px "Noto Sans Devanagari";color:var(--hint);margin-top:2px}
.eduFoot{font:400 11px/16px "Noto Sans Devanagari";color:#494551}

/* ── Drilldown bottom sheet (Figma 946:467 — fill #FFFFFF, top radius 24) ── */
.scrim{position:absolute;inset:0;background:rgba(22,16,33,.45);opacity:0;pointer-events:none;transition:opacity .24s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);
  border-radius:24px 24px 0 0;transform:translateY(101%);padding:8px 16px 24px;
  transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:92%;display:flex;flex-direction:column;gap:16px}
.sheet.on{transform:translateY(0)}
.grab{width:32px;height:4px;border-radius:2px;background:#49454F;margin:0 auto 6px;flex:0 0 auto}
.sheetScroll{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px}
.sheetScroll::-webkit-scrollbar{width:0}

/* Detail sheet body — Figma 946:467. White surface, 16px column gap,
   px 16 / pt 8 / pb 24. No chart: three white KPI cards carry the numbers. */
.shead{display:flex;gap:12px;align-items:flex-start}
.dchip{width:24px;height:24px;border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.dchip svg{width:14px;height:14px;display:block}
.dchip.ok{background:#E1FAED;color:#008043}
.dchip.bad{background:#FFE5E7;color:#D92130}
.dtexts{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dtitle{font:700 16px/24px "Noto Sans Devanagari";color:#161021}
.dsub{font:400 14px/22px "Noto Sans Devanagari";color:#5C5570}
.kpis{display:flex;gap:8px;align-items:stretch}
.kpi{flex:1;min-width:0;background:#FFFFFF;border-radius:12px;padding:12px;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:inset 0 0 0 1px #E5E7EB, 0 2px 4px rgba(0,0,0,.04)}
.kpi .kl{font:600 11px/14px "Noto Sans Devanagari";color:#6B7280;white-space:nowrap}
.kpi .kv{display:flex;align-items:baseline;gap:6px}
.kpi .kv b{font:700 22px/28px "Noto Sans Devanagari"}
.kpi .kv i{font:600 11px/14px "Noto Sans Devanagari";font-style:normal}
.kpi .ink{color:#111827} .kpi .pos{color:#008043} .kpi .neg{color:#D92130}
.dinfo{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px}
.dinfo p{flex:1;min-width:0;font:400 14px/22px "Noto Sans Devanagari";color:#5C5570}
.dinfo.pos p{line-height:18px}
.dinfo .di{width:16px;height:16px;flex:0 0 auto}
.dinfo .di svg{width:16px;height:16px;display:block}
.dinfo.pos{background:#E1FAED} .dinfo.pos .di{color:#008043}
.dinfo.neg{background:#FFE5F6} .dinfo.neg .di{color:#D92130}
.dfoot{font:400 12px/16px "Noto Sans Devanagari";color:#A7A1B2;text-align:right}

/* v6 */
.bsr{display:flex;gap:10px;align-items:flex-start;border-radius:var(--rs);padding:12px;margin-top:6px}
.bsr.ok{background:var(--heroOk)} .bsr.crit{background:var(--heroCrit)}
.bsr .bsi{width:20px;height:20px;flex:0 0 auto}
.bsr .bsi svg{width:20px;height:20px;display:block}
.bsr.ok .bsi{color:var(--pos)} .bsr.crit .bsi{color:var(--neg)}
.bstx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bstx b{font:700 15px/22px "Noto Sans Devanagari";color:var(--ink-a)}
.bstx > span{font:400 14px/21px "Noto Sans Devanagari";color:var(--ink-2)}
.bscta{display:flex;align-items:center;gap:2px;margin-top:14px;cursor:pointer;
  font:600 14px/20px "Noto Sans Devanagari";color:var(--brand)}
.bscta .go{width:18px;height:18px;color:var(--brand);transform:rotate(-90deg)}
.hero .htr{width:16px;height:16px;flex:0 0 auto;align-self:center}
.ttl2{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl2 > span:first-child{font:700 18px/24px "Noto Sans Devanagari";color:var(--ondark)}
.ttld{font:400 11px/15px "Noto Sans Devanagari";color:#C9B6C2}
.hchip .cstat .ctick.crit{color:var(--warnOrange)}
.bzgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bzc{background:#fff;border-radius:var(--r);padding:16px;min-height:118px;
  box-shadow:inset 0 0 0 1px #E5E1ED;display:flex;flex-direction:column;gap:10px;
  position:relative}
.bzc.tap{cursor:pointer}
.bzc .bzi{width:26px;height:26px;color:var(--ink-a)}
.bzc .bzi svg{width:26px;height:26px;display:block}
.bzc .bzl{flex:1;font:600 15px/22px "Noto Sans Devanagari";color:var(--ink-a)}
.bzc .bzg{width:20px;height:20px;color:var(--nonaction);transform:rotate(-90deg);
  position:absolute;right:12px;bottom:12px}
.ncard{background:#fff;border-radius:var(--r);overflow:hidden;
  box-shadow:inset 0 0 0 1px #E5E1ED}
.nchead{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer}
.nchead .nct{flex:1;min-width:0;font:600 15px/22px "Noto Sans Devanagari";color:var(--ink-a)}
.nchead .chev{width:24px;height:24px;color:var(--nonaction);flex:0 0 auto}
.nchead .circ .ic{width:20px;height:20px}
.nchead .circ .ic svg{width:100%;height:100%}
.ncbody{padding:2px 16px 16px}
.ncbody .tt{border-color:#E5E1ED}
.hchip .cerr{width:18px;height:18px;color:var(--warnOrange);position:absolute;top:12px;right:12px}
.hchip .cerr svg{width:18px;height:18px;display:block}
.hchip{position:relative}
.cstat{display:flex;align-items:center;gap:7px}
.cstat .ctick{width:20px;height:20px;flex:0 0 auto}
.cstat .badge{padding:3px 7px;font-size:11px;line-height:15px}
.bhnote{display:flex;gap:8px;align-items:center;background:var(--subtle);
  border-radius:var(--rs);padding:11px 12px;margin-top:14px}
.bhnote .bhni{width:18px;height:18px;flex:0 0 auto;color:#6D17CE}
.bhnote .bhni svg{width:18px;height:18px;display:block}
.bhnote > span:last-child{flex:1;min-width:0;
  font:500 13px/19px "Noto Sans Devanagari";color:var(--ink-2)}
.bhs{font:600 13px/19px "Noto Sans Devanagari";color:var(--ink-a);margin:16px 0 3px}
.bhp{font:400 14px/21px "Noto Sans Devanagari";color:var(--ink-2);margin-bottom:10px}
.bsl{font:600 11px/16px "Noto Sans Devanagari";letter-spacing:.05em;
  color:var(--ink-4);margin:16px 0 2px}
.brule.bsrow{padding:12px 0}
.brule.bsrow:first-of-type{margin-top:6px}
.brule.bsrow .bcount{margin-left:2px}
.cyclebar{font:600 13px/18px "Noto Sans Devanagari";color:var(--ink-2)}
.etotal{background:var(--sheet);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:2px}
.etotal .etk{font:400 14px/20px "Noto Sans Devanagari";color:var(--ink-2)}
.etotal .etv{font:700 32px/40px "Noto Sans";color:var(--ink);letter-spacing:-.5px}
.nkat{display:flex;align-items:center;gap:6px;margin-top:12px;cursor:pointer;
  font:600 13px/18px "Noto Sans Devanagari";color:var(--brand)}
.nkat .go{width:16px;height:16px;color:var(--brand);transform:rotate(-90deg)}


/* v5 status card: cycle, verdict and the reason, in one block. */
.bcard{border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:flex-start}
.bccol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bcard.ok{background:var(--heroOk);box-shadow:inset 0 0 0 1px #9AD1B6}
.bcard.no{background:var(--heroCrit);box-shadow:inset 0 0 0 1px #F2A8AD}
.bcd{font:400 12px/16px "Noto Sans Devanagari";color:var(--ink-3)}

.tmstat.ink b{color:#170F21}
.tmstat.pos b{color:#008042}
.tmstat.neg b{color:#D92130}
.tmstat.muted b{color:#A7A1B2}
/* Four data points need 191px of stats against 195px of free row, so M1 drops
   to the stacked form Figma 841:4668 uses for exactly that case. */
.tmrow.wide{flex-direction:column;align-items:stretch;gap:0}
.tmrow.wide .tmstats{width:100%;gap:0;margin-top:12px;padding-top:12px;border-top:1px solid #E8E4F0}
.tmrow.wide .tmstat{flex:1;min-width:0;align-items:center;text-align:center}


/* Bonus-param sheets (Figma 915:379 / 915:456): a list of connection cards,
   each expanding to its subscriber detail. */
.conns{display:flex;flex-direction:column;gap:8px}
.conn{background:#FFFFFF;border-radius:12px;padding:14px 16px;
  box-shadow:inset 0 0 0 1px #E8E4F0}
.ctop{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.cleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cid{font:600 16px/22px "Noto Sans";color:#161021}
.cloc{font:400 13px/18px "Noto Sans";color:#5C5570}
.cright{display:flex;flex-direction:column;gap:2px;text-align:right;flex:0 0 auto}
.cst{font:600 14px/20px "Noto Sans Devanagari"}
.cval{font:400 14px/20px "Noto Sans"}
.cright.neg .cst,.cright.neg .cval{color:#D92130}
.cright.pos .cst,.cright.pos .cval{color:#008043}
.cchev{width:20px;height:20px;flex:0 0 auto;color:#898296;margin-top:2px;
  transition:transform .26s ease}
.conn.open .cchev{transform:rotate(180deg)}
.cdet{padding-top:12px;display:flex;flex-direction:column;gap:8px}
.crule{height:1px;background:#E8E4F0;border:0}
.crow{display:flex;align-items:center;gap:8px}
.crow .cl{flex:1;min-width:0;font:400 14px/20px "Noto Sans Devanagari";color:#5C5570}
.crow .cv{font:400 14px/20px "Noto Sans";color:#161021;text-align:right}
.cmore{font:600 14px/20px "Noto Sans Devanagari";color:#D9008D;cursor:pointer;align-self:flex-start}
.cinfo{display:flex;gap:10px;align-items:flex-start;background:#F1EDF7;border-radius:12px;padding:12px}
.cinfo .di{width:20px;height:20px;flex:0 0 auto;color:#6D17CE}
.cinfo .di svg{width:20px;height:20px;display:block}
.cinfo p{flex:1;min-width:0;font:400 14px/22px "Noto Sans Devanagari";color:#5C5570}

/* Help sheet — mirrors QualityEducationSheet in the app. */
.hsheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--surface);
  border-radius:24px 24px 0 0;padding:8px 16px 24px;transform:translateY(101%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hsheet.on{transform:translateY(0)}
.hgrab{width:32px;height:4px;border-radius:2px;background:#3C3745;margin:4px auto 18px}
.hhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hhead .ic{width:20px;height:20px;color:var(--brand);flex:0 0 auto}
.hhead h3{font:700 16px/24px "Noto Sans Devanagari";color:var(--ink)}
.bul-row{display:flex;align-items:flex-start;gap:8px;margin-top:12px}
.bul-row:first-child{margin-top:0}
.bul-row.sub{margin-left:16px;margin-top:4px}
.bul-row .dot{font:400 16px/24px "Noto Sans";color:var(--ink-2);flex:0 0 auto}
.bul-row .txt{flex:1;font:400 16px/24px "Noto Sans Devanagari";color:var(--ink-2)}
.hscrim{position:absolute;inset:0;background:rgba(22,16,33,.45);opacity:0;pointer-events:none;transition:opacity .24s;z-index:7}
.hscrim.on{opacity:1;pointer-events:auto}
.hsheet p.sub{font:400 14px/22px "Noto Sans Devanagari";color:var(--ink-2);margin-bottom:14px}
.tt{width:100%;border-collapse:separate;border-spacing:0;border-radius:var(--rs);overflow:hidden;border:1px solid var(--muted)}
.tt th{background:var(--subtle);font:400 12px/16px "Noto Sans Devanagari";color:var(--ink-2);
  text-align:left;padding:10px 8px;font-weight:400}
.tt td{background:var(--surface);font:400 13px/18px "Noto Sans Devanagari";color:var(--ink);
  padding:11px 8px;border-top:1px solid var(--muted)}
.tt tr.cur td{background:#F6FDFA}
.tpill{display:inline-block;border-radius:var(--rp);padding:3px 9px;font:600 12px/16px "Noto Sans Devanagari"}
.tpill.pos{background:var(--pillOk);color:var(--pos)}
.tpill.info{background:#F1E5FF;color:#6D17CE}
.tpill.basic{background:#FFF2BF;color:var(--warnInk)}

.cover{background:#FFE9A8;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px}
.cover h2{font:700 26px/1.3 "Noto Sans";text-align:center}
.cover button{background:#161021;color:#fff;border:0;border-radius:var(--rp);padding:14px 40px;font:700 17px/1 "Noto Sans";cursor:pointer}
</style>
</head>

const qmark = (k,mod)=>`<span class="qbtn ${mod||''}" data-help="${k}">${D.ICONS.question_mark}</span>`;

/* Domain heads use an 18px bordered bubble, distinct from the 20px row one. */
const domMark = (met)=> met ? `<span class="bubble sm pass">${icon('check')}</span>` : `<span class="bubble sm fail">!</span>`;

/* One row shape for metrics and bonus params: label + help on the left,
   trend + value (+ target beneath) + chevron on the right. */
function metricRow(r, o){
  o = o || {};
  const tone = r.tone || (r.met ? 'pos' : 'neg');
  const dir = r.trend || (r.met ? 'up' : 'down');
  const ic = dir === 'flat' ? D.ICONS.trending_flat
    : (dir === 'down' ? D.ICONS.trend_down : D.ICONS.trend_up);
  return `<div class="mrow" data-metric="${r.m||''}" data-tone="${tone==='neg'?'neg':'pos'}">
    <div class="l1">
      <span class="lbl" ${o.bold?'style="font-weight:600"':''}>${esc(r.label)}</span>${(o.noHelp||!(r.m||r.help))?'':qmark(r.m||r.help)}
      <span class="spacer"></span>
      <span class="rt">
        <span class="vwrap">
          <span class="ic trend" style="color:var(--${tone==='pos'?'pos':tone==='neg'?'neg':'ink-3'})">${ic}</span>
          <span class="val ${tone==='pos'?'pos':tone==='neg'?'neg':''}" ${tone==='neutral'?'style="color:var(--ink-3)"':''}>${esc(r.v)}</span>${r.inlineTarget?`<span class="itgt">${esc(r.inlineTarget)}</span>`:''}
        </span>
        ${r.target?`<span class="tgt2">${esc(r.target)}</span>`:''}
      </span>
      <span class="ic go">${D.ICONS.keyboard_arrow_down}</span>
    </div>
  </div>`;
}
const rowSet = (rows, o) => `<div class="rowset${o&&o.bonus?' bonusset':''}">` +
  rows.map(r=>metricRow(r,o)).join('<div class="rule"></div>') + '</div>';

/* v5 bonus screen: one status card, then the two questions. */

/* Bonus is a sheet now, not a screen. What it says depends on which of the two
   things is holding the bonus back. */
function openBonus(){
  // Quality comes from the screen you are on, network from the case, so the
  // sheet always matches the Seva Sthiti verdict it was opened against.
  const Q = {compliant:[4,4], atrisk:[3,4], noncompliant:[0,4]}[st.home];
  const {C} = bonusStatus();
  const NP = (D.BONUS_PAY.states[st.home] || C).params;
  const eligible = Q[0] === Q[1];
  const netOk = NP.filter(p=>p.met).length;
  const zero = netOk === 0;
  const ok = eligible && !zero;

  const head = ok ? 'बोनस पाने की राह पर हैं' : 'बोनस खतरे में है';

  // Only what is wrong. A condition that passes says nothing here.
  const row = (t, s2, go) => `<div class="brule bsrow" data-go="${go}">
      <span class="bctx"><b>${esc(t)}</b><span>${esc(s2)}</span></span>
      <span class="bmark fail">${D.ICONS.error}</span>
      <span class="ic go">${D.ICONS.keyboard_arrow_down}</span>
    </div>`;
  // Name the offenders rather than counting them.
  const names = l => l.length <= 1 ? (l[0]||'')
                  : l.slice(0,-1).join(', ') + ' और ' + l[l.length-1];
  const qNames = [];
  (D.HOMES[st.home].domains||[]).forEach(d=>(d.rows||[]).forEach(r=>{
    if(!r.met) qNames.push((D.METRICS[r.m]||{}).title || r.label); }));
  const nNames = NP.filter(p=>!p.met).map(p=>p.name);

  const bad = [];
  if(!eligible && qNames.length) bad.push(row('सेवा स्थिति',
      `${names(qNames)} ${qNames.length>1?'खराब हैं':'खराब है'}`, 'home'));
  if(nNames.length) bad.push(row('मेरा नेटवर्क',
      `${names(nNames)} ${nNames.length>1?'बेसिक हैं':'बेसिक है'}`, 'net'));

  const where = [];
  if(!eligible) where.push('सेवा स्थिति');
  if(nNames.length) where.push('नेटवर्क');
  const sub = where.length ? `${where.join(' और ')} में ज़रूरी सुधार करें`
                           : 'ऐसे ही काम करते रहें';

  const el = document.getElementById('hsheet');
  el.innerHTML = `<div class="hgrab"></div>
    <div class="bsr ${ok?'ok':'crit'}">
      <span class="ic bsi">${ok?D.ICONS.check_circle:D.ICONS.error}</span>
      <span class="bstx"><b>${head}</b>${sub?`<span>${sub}</span>`:''}</span>
    </div>
    ${bad.join('')}`;
  document.getElementById('hscrim').classList.add('on');
  el.classList.add('on');
}

function bonusV5HTML(){
  const {C, tone, head, sub} = bonusStatus();
  // बेसिक counts as a fail, the same rule मेरा नेटवर्क grades on
  const netOk = C.params.filter(p=>p.met).length;
  const rate = C.eligible && !C.zero;
  const line = !C.eligible ? esc(head)
             : C.zero      ? 'आपका बोनस नहीं बन रहा'
             : 'आप बोनस पाने की राह पर हैं';

  const rule = (mark, t, s, go, count) => `<div class="brule" data-go="${go}">
      <span class="bctx"><b>${esc(t)}</b><span>${esc(s)}</span></span>
      ${mark?`<span class="bmark ${mark}">${mark==='pass'?D.ICONS.check_circle:D.ICONS.error}</span>`:''}
      ${count?`<span class="bcount">${esc(count)}</span>`:''}
      <span class="ic go">${D.ICONS.keyboard_arrow_down}</span>
    </div>`;

  return `<div class="topbar">
      <span class="ic tap" style="width:24px;height:24px;color:var(--ondark)" data-back="1">${D.ICONS.arrow_back}</span>
      <span class="ttl">बोनस</span>
      <span class="ic tap dbgBtn ${st.dbg?'on':''}" id="dbgBtn">${D.ICONS.bug_report}</span>
    </div>
    <div class="scroll"><div class="body">
      ${st.dbg?dbgHTML():''}

      <div class="bcard ${rate?'ok':'no'}">
        <span class="ic bci">${rate?D.ICONS.check_circle:D.ICONS.error}</span>
        <span class="bccol">
          <span class="bcd">16–31 जुलाई</span>
          <span class="bct">${line}</span>
          ${sub?`<span class="bcs">${esc(sub)}</span>`:''}
        </span>
      </div>

      <div>
        <div class="sec-head"><span class="t">बोनस कब मिलता है</span></div>
        <div class="sec-sub">सेवा स्थिति सही होने पर आप बोनस के लिए एलिजिबल होते हैं</div>
        <div class="card pad" style="margin-top:12px">
          ${rule(C.eligible?'pass':'fail', 'सेवा स्थिति',
                 C.eligible ? 'चारों क्वालिटी सही हैं' : `${C.of} में से ${C.ok} क्वालिटी सही हैं`,
                 'home', `${C.ok}/${C.of}`)}
        </div>
      </div>

      <div>
        <div class="sec-head si"><span class="t">बोनस कितना मिलता है</span>
          ${C.eligible?`<span class="ic secinfo" data-rates="1">${INFO_SVG}</span>`:''}</div>
        <div class="sec-sub">स्पीड और ऑप्टिकल पॉवर, दोनों की क्वालिटी के अनुसार हर रिचार्ज पर बोनस मिलता है।</div>
        <div class="card pad" style="margin-top:12px">
          ${rule(netOk === C.params.length ? 'pass' : 'fail', 'मेरा नेटवर्क',
                 C.eligible ? (C.full?'दोनों बहुत अच्छा पर हैं':'नेटवर्क की क्वालिटी जितनी अच्छी, उतना ज़्यादा बोनस')
                            : 'सेवा स्थिति सही होने के बाद ही गिनी जाएगी', 'net',
                 `${netOk}/${C.params.length}`)}
        </div>
      </div>
    </div></div>`;
}

function bonusV4HTML(){
  const {C, P, tone, head, sub} = bonusStatus();

  // Quality gates eligibility; the categories only decide how much.
  const cases = [];
  if(!C.eligible) cases.push({tone:'crit', t: C.bad.length===1 ? 'सेवा स्थिति में 1 चीज़ खराब है'
                          : `सेवा स्थिति में ${C.bad.length} चीज़ें खराब हैं`,
    s: C.bad.join(' · ') + ' ठीक करें, तभी बोनस मिलेगा',
    cta:'सेवा स्थिति देखें', go:'home'});
  else P.filter(p=>p.cat!=='बहुत अच्छा').forEach(p=>cases.push({
    tone: p.cat==='बेसिक' ? 'crit' : 'warn',
    t: `${p.name} ${p.cat} है`,
    s: `अभी ${p.v} · ${p.cat==='बेसिक'?'इस पर अभी बोनस नहीं बन रहा':'बहुत अच्छा पर पूरा बोनस बनेगा'}`,
    cta:'मेरा नेटवर्क देखें', go:'net'}));

  const caseCards = cases.map(c=>`<div class="bcase ${c.tone}" data-go="${c.go}">
      <span class="ic bci">${c.tone==='crit'?D.ICONS.error:D.ICONS.info}</span>

        <span class="bcta">${esc(c.cta)}</span></span>
      <span class="ic go">${D.ICONS.keyboard_arrow_down}</span>
    </div>`).join('');

  const rule = (mark, t, s, go, count, rate) => `<div class="brule" data-go="${go}">
      <span class="bctx"><b>${esc(t)}</b><span>${esc(s)}</span></span>
      ${rate?`<span class="brate ${rate==='बोनस नहीं'?'zero':''}">${esc(rate)}</span>`:''}
      ${mark?`<span class="bmark ${mark}">${mark==='pass'?D.ICONS.check_circle:D.ICONS.error}</span>`:''}
      ${count?`<span class="bcount">${esc(count)}</span>`:''}
      <span class="ic go">${D.ICONS.keyboard_arrow_down}</span>
    </div>`;

  return `<div class="topbar">
      <span class="ic tap" style="width:24px;height:24px;color:var(--ondark)" data-back="1">${D.ICONS.arrow_back}</span>
      <span class="ttl">बोनस</span>
      <span class="ic tap dbgBtn ${st.dbg?'on':''}" id="dbgBtn">${D.ICONS.bug_report}</span>
    </div>
    <div class="scroll"><div class="body">
      ${st.dbg?dbgHTML():''}

      <div class="payhero ${tone}">
        <span class="pc">16–31 जुलाई</span>
        <span class="pv no">${esc(head)}</span>
        ${sub?`<span class="phs">${esc(sub)}</span>`:''}
      </div>

      <div>
        <div class="sec-head"><span class="t">बोनस कब मिलता है</span></div>
        <div class="sec-sub">बोनस पाने के लिए सेवा स्थिति का सही होना ज़रूरी है</div>
        <div class="card pad" style="margin-top:12px">
          ${rule(C.eligible?'pass':'fail', 'सेवा स्थिति',
                 C.eligible ? 'चारों क्वालिटी सही हैं' : `${C.of} में से ${C.ok} क्वालिटी सही हैं`,
                 'home', `${C.ok}/${C.of}`)}
        </div>
      </div>

      <div>
        <div class="sec-head"><span class="t">बोनस कितना मिलता है</span></div>
        <div class="sec-sub">स्पीड और ऑप्टिकल पॉवर, दोनों की क्वालिटी के अनुसार हर रिचार्ज पर बोनस मिलता है।</div>
        ${C.eligible?`<div class="bnow ${C.zero?'no':''}">
          <span class="ic bni">${C.zero?D.ICONS.error:D.ICONS.check_circle}</span>
          <span class="bnot">${C.zero ? 'आपको बोनस नहीं मिल रहा'
                         : `अभी आपको <b>${esc(C.amt)} प्रति रिचार्ज</b> बोनस मिल सकता है`}</span>
          <span class="ic bnoi" data-rates="1">${INFO_SVG}</span>
        </div>`:''}

/* The category table. Rows the CSP currently sits on are marked. */
function payTableHTML(S, withPay, withMine){
  const pay = withPay !== false;   // the app's own sheet has no rupee column
  const mineOn = withMine !== false;
  return `<table class="tt">
      <tr><th>${D.TIERS.cols.map(esc).join('</th><th>')}</th>${pay?'<th>बोनस</th>':''}</tr>
      ${D.BONUS_PAY.payRows.map(r=>{
        const mine = mineOn ? S.params.filter(p=>p.cat===r.pill) : [];
        return `<tr class="${mine.length?'cur':''}">
        <td><span class="tpill ${r.tone}">${esc(r.pill)}</span>
          ${mine.length?`<span class="tmine">${mine.map(p=>esc(p.short)).join(' · ')}</span>`:''}</td>
        <td>${esc(r.oor)}</td><td>${esc(r.sdph)}</td>
        ${pay?`<td class="pay">${esc(r.pay)}</td>`:''}</tr>`;}).join('')}
    </table>`;
}

/* The metric sheets answer "how much"; the team block answers "who".
   Bonus sheets list connections instead, so they never get this. */
function teamHTML(){
  const t = D.TEAM[st.metric] && D.TEAM[st.metric][st.tone];
  if(!t) return '';
  const rows = t.rows.map(r=>{
    const stats = r.s.map(([v,tone],i)=>
      `<span class="tmstat ${tone}"><b>${esc(v)}</b><span>${esc(t.cols[i])}</span></span>`).join('');
    return `<div class="tmrow ${t.cols.length > 3 ? 'wide' : ''}">
      <span class="tmwho">
        <span class="tmav">${esc(r.i)}</span>
        <span class="tmname"><b>${esc(r.n)}</b><span>${esc(r.r)}</span></span>
      </span>
      <span class="tmstats">${stats}</span>
    </div>`;
  }).join('');
  return `<div class="tmrule"></div>
    <div class="tmsec"><div class="tmhead">${esc(D.TEAM.head)}</div>${rows}</div>`;
}

function wireConns(){
  screen.querySelectorAll('[data-conn]').forEach(el=>{
    if(el.dataset.wired) return;
    el.dataset.wired = '1';
    el.onclick = ()=>{
      const card = el.closest('.conn'), was = card.classList.contains('open');
      screen.querySelectorAll('.conn.open').forEach(c=>{
        c.classList.remove('open'); c.querySelector('.collapse').classList.remove('open'); });
      if(!was){ card.classList.add('open'); card.querySelector('.collapse').classList.add('open'); }
      st.conn = was ? -1 : +el.dataset.conn;
    };
  });
}

function sheetHTML(){
  if(!st.metric) return '';
  if(D.BONUS[st.metric]) return bonusSheetHTML(D.BONUS[st.metric]);
  const d = D.METRICS[st.metric][st.tone];
  const ok = st.tone === 'pos';
  const cards = d.kpis.map(k=>`<div class="kpi"><span class="kl">${esc(k.l)}</span>
    <span class="kv"><b class="${k.t}">${esc(k.v)}</b>${k.p?`<i class="${k.t}">${esc(k.p)}</i>`:''}</span></div>`).join('');
  return `<div class="grab"></div>
    <div class="sheetScroll">
      <div class="shead">
        <span class="dchip ${ok?'ok':'bad'}">${ok?D.ICONS.check_circle:D.ICONS.error}</span>
        <div class="dtexts">
          <p class="dtitle">${esc((D.METRICS[st.metric]||{}).title || d.head)}</p>
        </div>
      </div>
      <div class="kpis">${cards}</div>

      <p class="dfoot">${esc(D.FOOT)}</p>
    </div>`;
}

/* ── Paint ───────────────────────────────────────────────────────────── */
function paint(){
  if(st.view==='cover'){
    screen.innerHTML = `<div class="canvas"><div class="cover"><h2>Seva Sthiti — Home and Drilldown screens</h2><button id="start">Start</button></div></div>`;
    document.getElementById('start').onclick = ()=>{ st.view='home'; paint(); };
    paintPanel(); return;
  }
  screen.innerHTML = `<div class="canvas">${st.view==='app'?appHTML():st.view==='biz'?bizHTML():st.view==='net'?netHTML():st.view==='earn'?earnHTML():st.view==='work'?workHTML():homeHTML()}</div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">${sheetHTML()}</div>
    <div class="drawer ${st.drawer && st.view==='app' ?'on':''}" id="drawer">${st.view==='app'?navHTML():''}</div>
    <div class="hscrim" id="hscrim"></div>
    <div class="hsheet" id="hsheet"></div>`;
  if(st.metric){
    requestAnimationFrame(()=>{
      document.getElementById('scrim').classList.add('on');
      document.getElementById('sheet').classList.add('on');
    });
  }
  wire(); paintPanel();
}

function openHelp(k){
  const h = D.HELP[k]; if(!h) return;
  const lines = (h.w ? h.b + '\n' + h.w : h.b).split('\n').filter(l=>l.trim());
  const bullets = lines.map(l=>{
    const sub = /^\s/.test(l);
    return `<div class="bul-row${sub?' sub':''}"><span class="dot">•</span><span class="txt">${esc(l.trim())}</span></div>`;
  }).join('');
  const s = document.getElementById('hsheet');
  s.innerHTML = `<div class="hgrab"></div><div class="hhead"><span class="ic">${INFO_SVG}</span><h3>${esc(h.t)}</h3></div>${bullets}`;
  document.getElementById('hscrim').classList.add('on');
  s.classList.add('on');
}
/* The "?" on the bonus banner opens the tier table, taken from the app's
   बोनस की कैटेगरी sheet. The CSP's current tier is highlighted per state. */
function openTiers(){
  const T = D.TIERS, cur = T.current[st.home];
  const head = `<tr><th>${T.cols.map(esc).join('</th><th>')}</th></tr>`;
  const body = T.rows.map((r,i)=>`<tr class="${i===cur?'cur':''}">
      <td><span class="tpill ${r.tone}">${esc(r.pill)}</span></td>
      <td>${esc(r.oor)}</td><td>${esc(r.sdph)}</td></tr>`).join('');
  const s = document.getElementById('hsheet');
  s.innerHTML = `<div class="hgrab"></div>
    <div class="hhead"><span class="ic">${INFO_SVG}</span><h3>${esc(T.t)}</h3></div>
    <p class="sub">${esc(T.sub)}</p>
    <table class="tt">${head}${body}</table>`;
  document.getElementById('hscrim').classList.add('on');
  s.classList.add('on');
}
function closeHelp(){
  document.getElementById('hscrim').classList.remove('on');
  document.getElementById('hsheet').classList.remove('on');
}
function closeSheet(){
  const sc = document.getElementById('scrim'), sh = document.getElementById('sheet');
  sc.classList.remove('on'); sh.classList.remove('on');
  setTimeout(()=>{ st.metric = null; paint(); }, 300);
}

function wire(){
  screen.querySelectorAll('[data-help]').forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();openHelp(el.dataset.help);} });
  screen.querySelectorAll('[data-tiers]').forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();openTiers();} });
  document.getElementById('hscrim').onclick = closeHelp;
  document.getElementById('scrim').onclick = closeSheet;
  screen.querySelectorAll('[data-metric]').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); st.metric=el.dataset.metric; st.tone=el.dataset.tone;
      st.conn=0; st.connMore=false; paint(); };
  });
  screen.addEventListener('click', (e)=>{
    if(e.target.closest('[data-bands]')){ e.stopPropagation(); openBands(); }
    const gb = e.target.closest('[data-gobonus]');
    if(gb){ e.stopPropagation();
      st.back.push(st.view); st.view = 'earn'; st.metric = null; st.drawer = false;
      st.earn[2] = true; paint(); return; }
    if(e.target.closest('[data-bhelp]')){ e.stopPropagation(); openBonusHelp(); return; }
    if(e.target.closest('[data-bonus]')){ e.stopPropagation(); openBonus(); }
    // Sheet contents are injected after wire() runs, so their links need
    // delegation. Close the sheet first, then navigate.
    const sg = e.target.closest('#hsheet [data-go]');
    if(sg){ e.stopPropagation(); closeHelp();
      if(sg.dataset.go !== st.view) st.back.push(st.view);
      st.view = sg.dataset.go; st.metric = null; st.drawer = false; paint(); }
    if(e.target.closest('[data-rates]')){ e.stopPropagation(); openRates(); }
  }, true);
  screen.querySelectorAll('[data-earn]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target.closest('[data-go]')) return;
      const i=+el.dataset.earn, c=el.closest('.ecard');
      st.earn[i] = !st.earn[i];
      c.querySelector('.collapse').classList.toggle('open', st.earn[i]);
      c.querySelector('.chev').classList.toggle('up', st.earn[i]); };
  });
  screen.querySelectorAll('[data-back]').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation();
      st.view = st.back.pop() || 'app'; st.metric = null; st.drawer = false; paint(); };
  });
  screen.querySelectorAll('[data-ncat]').forEach(el=>{
    el.onclick=()=>{ st.ncat = !st.ncat; const c = el.closest('.ncard');
      c.querySelector('.collapse').classList.toggle('open', st.ncat);
      el.querySelector('.chev').classList.toggle('up', st.ncat); };
  });
  screen.querySelectorAll('[data-drawer]').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation();
      const d=document.getElementById('drawer');
      st.drawer = el.dataset.drawer === '1';
      d.classList.toggle('on', st.drawer); };
  });
  const dn = screen.querySelector('[data-dbgnav]');
  if(dn) dn.onclick = ()=>{ st.dbg = !st.dbg; st.drawer = false; paint(); };
  screen.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation();
      if(el.dataset.go !== st.view) st.back.push(st.view);
      st.view = el.dataset.go; st.metric = null; st.drawer = false; paint(); };
  });
  const db = document.getElementById('dbgBtn');
  if(db) db.onclick = ()=>{ st.dbg = !st.dbg; paint(); };
  screen.querySelectorAll('[data-dbg]').forEach(el=>{
    el.onclick=()=>{ const k=el.dataset.dbg, v=el.dataset.v;
      if(k==='h'){ st.home=v; st.metric=null; st.prev=false; st.edu=false; }
      else if(k==='v'){ st.view = v; st.metric = null; }
      else if(k==='m'){ st.metric = v || null; st.conn=0; st.connMore=false; }
      else { st.tone=v; }
      paint(); };
  });
  wireConns();
  const cm = document.getElementById('cmore');
  if(cm) cm.onclick = ()=>{
    // Append in place for the same reason: a repaint would replay the slide-up.
    const b = D.BONUS[st.metric], n = b.conns.length;
    screen.querySelector('.conns').insertAdjacentHTML('beforeend',
      b.extra.map((c,j)=>connHTML(b, c, n+j)).join(''));
    cm.remove(); st.connMore = true; wireConns();
  };
  screen.querySelectorAll('[data-dom]').forEach(el=>{
    el.onclick=()=>{ const i=el.dataset.dom;
      const b=screen.querySelector(`[data-body="${i}"]`), c=screen.querySelector(`[data-chev="${i}"]`);
      b.classList.toggle('open'); c.classList.toggle('up');
      D.HOMES[st.home].domains[i].open = b.classList.contains('open'); };
  });
  const pt=document.getElementById('prevT');
  if(pt) pt.onclick=()=>{ st.prev=!st.prev;
    document.getElementById('prevB').classList.toggle('open',st.prev);
    document.getElementById('prevC').classList.toggle('up',st.prev); };
  const et=document.getElementById('eduT');
  if(et) et.onclick=()=>{ st.edu=!st.edu;
    document.getElementById('eduB').classList.toggle('open',st.edu);
    document.getElementById('eduC').classList.toggle('up',st.edu); };
}

/* ── Outside-the-frame controls ──────────────────────────────────────── */
/* Phone-only prototype switcher. The desktop side panel is hidden under
   720px, so the same cases live behind the bug icon in the top bar. */
const SEGS = [
  ['Screen', 'v', ()=>[['app','App home'],['net','मेरा नेटवर्क'],['earn','कमाई'],
      ['home','Quality OS'],['biz','मेरा बिज़नेस']], ()=>st.view],
  ['Home · state', 'h', ()=>[['atrisk',0],['compliant',0],['noncompliant',0]]
      .map(([k])=>[k, D.HOMES[k].label]), ()=>st.home],
];
function dbgHTML(){
  const grps = SEGS.map(([title,key,items,cur])=>`<div class="dbgGrp">
      <div class="dbgLbl">${title}</div>
      <div class="dbgSeg">${items().map(([k,l])=>
        `<button data-dbg="${key}" data-v="${k}" class="${cur()===k?'on':''}">${esc(l)}</button>`).join('')}</div>
    </div>`).join('');
  return `<div class="dbgPanel">${grps}</div>`;
}

function paintPanel(){
  // Read the labels from the data so the panel can't drift from the cards.
  const homes=[['atrisk','AT_RISK'],['compliant','COMPLIANT'],['noncompliant','NON_COMPLIANT']]
    .map(([k,code])=>[k, D.HOMES[k].label + ' · ' + code]);
  document.getElementById('segHome').innerHTML = homes.map(([k,l])=>
    `<button data-h="${k}" class="${st.home===k&&st.view!=='cover'?'on':''}">${l}</button>`).join('');
  const segB = document.getElementById('segBcase');
  if(segB){
    segB.innerHTML = D.BCASES.map(c=>
      `<button data-b="${c.id}" class="${st.bcase===c.id?'on':''}">${esc(c.label)}</button>`).join('');
    segB.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      st.bcase=b.dataset.b; st.view='bonus'; st.metric=null; paint(); });
  }
  const segV = document.getElementById('segView');
  if(segV){
    segV.innerHTML = [['app','App home'],['net','मेरा नेटवर्क'],['earn','कमाई'],['home','Quality OS'],['biz','मेरा बिज़नेस'],].map(([k,l])=>
      `<button data-v="${k}" class="${st.view===k?'on':''}">${l}</button>`).join('');
    segV.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      st.view=b.dataset.v; st.metric=null; paint(); });
  }
  document.querySelectorAll('#segHome button').forEach(b=>b.onclick=()=>{
    st.home=b.dataset.h; st.view='home'; st.prev=false; st.edu=false; paint(); });
}

paint();
if(q.get('help')) setTimeout(()=>openHelp(q.get('help')), 80);
if(q.get('tiers')) setTimeout(openTiers, 80);
/* ?measure=1 prints element boxes so they can be diffed against Figma numbers. */
if(q.get('measure')) setTimeout(()=>{
  const cv=document.querySelector('.canvas'); const top=cv.getBoundingClientRect().top;
  if(q.get('s')==='detail'){
    const sh=document.querySelector('.sheet'), t2=sh.getBoundingClientRect().top;
    const p2=[['Sheet','.sheet'],['Grab','.grab'],['Head','.shead'],['Chip','.dchip'],
      ['Title','.dtitle'],['Sub','.dsub'],['Kpis','.kpis'],['Kpi1','.kpi'],
      ['Info','.dinfo'],['Foot','.dfoot'],['Conns','.conns'],['Conn1','.conn'],
      ['CTop','.ctop'],['CDet','.cdet'],['CMore','.cmore'],['CInfo','.cinfo']];
    const o2=p2.map(([n,sel])=>{const e=document.querySelector(sel); if(!e) return n+' MISSING';
      const r=e.getBoundingClientRect();
      return n+' y='+Math.round(r.top-t2)+' h='+Math.round(r.height)+' w='+Math.round(r.width);}).join(' | ');
    const pr=document.createElement('pre'); pr.id='measure'; pr.textContent=o2; document.body.appendChild(pr);
    return;
  }
  const pick=[['TopBar','.topbar'],['Body','.body'],['Hero','.hero'],['HeroHead','.hero .head'],
    ['HeroDivider','.hero .divider'],['HeroRow','.hero .mrow'],['SecA','.body > div:nth-child(2)'],
    ['Dom1','.dom'],['Dom1Head','.dom .dhead'],['Dom1Row','.dom .mrow'],
    ['Dom2','.stack > .dom:nth-child(2)'],['SecB','.body > div:nth-child(3)'],
    ['Banner','.banner'],['BonusCard','.card.pad'],['BonusRow','.brow'],
    ['Foot','.body > div:nth-child(4)'],['FootCard','.footcard']];
  const out=pick.map(([n,sel])=>{const e=document.querySelector(sel); if(!e) return n+' MISSING';
    const r=e.getBoundingClientRect();
    return n+' y='+Math.round(r.top-top)+' h='+Math.round(r.height)+' w='+Math.round(r.width);}).join(' | ');
  const pre=document.createElement('pre'); pre.id='measure'; pre.textContent=out; document.body.appendChild(pre);
}, 400);
/* ?raw=1 strips the device chrome so a screen can be diffed 1:1 against its frame. */
if(q.get('raw')){ document.body.style.cssText='margin:0;padding:0;background:#F1EDF7;display:block';
  document.querySelector('.panel').style.display='none';
  const dv=document.querySelector('.device'); dv.style.cssText='width:360px;height:1025px;padding:0;border-radius:0;box-shadow:none';
  const sc=document.getElementById('screen'); sc.style.cssText='width:360px;height:1025px;border-radius:0;position:relative;overflow:visible';
  const cv=sc.querySelector('.canvas'); if(cv) cv.style.position='relative';
  const sr=sc.querySelector('.scroll'); if(sr) sr.style.overflow='visible'; }
</script>
